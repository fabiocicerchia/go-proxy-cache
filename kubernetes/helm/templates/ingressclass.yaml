{{- if .Values.controller.enabled -}}
{{- if .Values.controller.ingressClassResource.create -}}
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ .Values.controller.ingressClass }}
  labels:
    {{- include "go-proxy-cache.labels" . | nindent 4 }}
  {{- if .Values.controller.ingressClassResource.default }}
  annotations:
    # Claims every Ingress that names no class at all.
    ingressclass.kubernetes.io/is-default-class: "true"
  {{- end }}
spec:
  controller: {{ .Values.controller.controllerName }}
{{- end }}
{{- end }}
