---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Runs go-proxy-cache as a Kubernetes ingress controller: routes come from
# Ingress (and, when the Gateway API CRDs are installed, Gateway/HTTPRoute)
# objects rather than from the `domains` block of config.yml.
#
#   kubectl apply -k kubernetes/kustomize/ingress-controller

namespace: go-proxy-cache

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - ingressclass.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
