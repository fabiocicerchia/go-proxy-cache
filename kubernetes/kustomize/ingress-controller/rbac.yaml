---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: go-proxy-cache
rules:
  # The objects the routing table is built from.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "secrets", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # Only needed with -gateway-api; harmless when the CRDs are absent.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses", "gateways", "httproutes", "referencegrants"]
    verbs: ["get", "list", "watch"]
  # Status write-back, done only by the replica holding the lease.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses/status", "gateways/status", "httproutes/status"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: go-proxy-cache
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: go-proxy-cache
subjects:
  - kind: ServiceAccount
    name: go-proxy-cache
    namespace: go-proxy-cache
---
# Leader election is namespaced: the Lease lives beside the controller pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: go-proxy-cache-election
  namespace: go-proxy-cache
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: go-proxy-cache-election
  namespace: go-proxy-cache
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: go-proxy-cache-election
subjects:
  - kind: ServiceAccount
    name: go-proxy-cache
    namespace: go-proxy-cache
