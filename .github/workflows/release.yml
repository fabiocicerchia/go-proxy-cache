on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Create Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Creating the release and uploading its assets is the one write this
# repository's workflows need.
permissions:
  contents: write

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e  # v2
        with:
          # The job never pushes: don't leave the token in .git/config,
          # where anything that archives the workspace picks it up.
          persist-credentials: false

      - run: git fetch --prune --unshallow --tags

      - name: Create changelogs
        id: changelogs
        uses: heineiuo/create-changelogs@5bf91a49ec2062a47e1593edb72c702e7a1224c2  # master

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844  # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: ${{ steps.changelogs.outputs.changelogs }}
          draft: false
          prerelease: ${{ steps.changelogs.outputs.release_type == 'prerelease' }}
          files: |
            dist/*

      - uses: ethomson/send-tweet-action@288f9339e0412e3038dce350e0da5ecdf12133a6  # v1
        with:
          status: "The version ${{ github.ref }} of go-proxy-cache has been released. https://github.com/fabiocicerchia/go-proxy-cache"
          consumer-key: ${{ secrets.TWITTER_CONSUMER_API_KEY }}
          consumer-secret: ${{ secrets.TWITTER_CONSUMER_API_SECRET }}
          access-token: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          access-token-secret: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
