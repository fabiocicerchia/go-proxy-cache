---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    meta.service: redis
  name: cache-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      meta.service: redis
  strategy: {}
  template:
    metadata:
      labels:
        meta.service: redis
    spec:
      containers:
      - image: redis:8-alpine
        name: redis
        ports:
        - containerPort: 6379
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - NET_RAW
      restartPolicy: Always
      serviceAccountName: ""
